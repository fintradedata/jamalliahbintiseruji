<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informasi Nasabah</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080d14;
    color:#fff;
    font-family:Arial,sans-serif;
}

.app{
    width:min(100%,400px);
    min-height:100vh;
    margin:auto;
    background:#0e1621;
    padding-bottom:75px;
}

.header{
    height:64px;
    padding:0 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #263342;
}

.logo{
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
}

.logo span{
    color:#19d39c;
}

.profile{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#1b2938;
    color:white;
    cursor:pointer;
}

.content{
    padding:18px 16px;
}

.welcome{
    color:#7f8c9d;
    font-size:12px;
}

.name{
    margin-top:5px;
    font-size:20px;
    font-weight:bold;
}

/* RDN */

.rdn-card{
    margin-top:18px;
    padding:20px;
    border-radius:15px;
    background:linear-gradient(145deg,#172536,#101923);
    border:1px solid #29394b;
    cursor:pointer;
    transition:.2s;
}

.rdn-card:active{
    transform:scale(.98);
}

.rdn-label{
    color:#8491a2;
    font-size:11px;
}

.rdn-balance{
    margin-top:8px;
    font-size:28px;
    font-weight:bold;
}

.rdn-status{
    margin-top:8px;
    color:#19d39c;
    font-size:11px;
}

/* MENU */

.section-title{
    margin:23px 0 10px;
    font-size:15px;
    font-weight:bold;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.menu-item{
    width:100%;
    min-height:62px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid #29384a;
    border-radius:12px;
    background:#131e2a;
    color:#fff;
    cursor:pointer;
    text-align:left;
    transition:.2s;
}

.menu-item:active{
    transform:scale(.98);
}

.icon{
    width:38px;
    height:38px;
    border-radius:10px;
    background:#1b2938;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
}

.menu-title{
    font-size:13px;
    font-weight:bold;
}

.menu-subtitle{
    margin-top:4px;
    color:#758294;
    font-size:10px;
}

/* INFO */

.info{
    border:1px solid #29384a;
    border-radius:12px;
    background:#131e2a;
    overflow:hidden;
}

.info-row{
    min-height:52px;
    padding:11px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #222e3c;
    cursor:pointer;
}

.info-row:last-child{
    border-bottom:0;
}

.info-row:active{
    background:#182532;
}

.label{
    color:#7e8b9b;
    font-size:11px;
}

.value{
    font-size:12px;
    font-weight:bold;
    text-align:right;
}

.green{
    color:#19d39c;
}

/* NAV */

.nav{
    position:fixed;
    bottom:0;
    width:min(100%,400px);
    height:65px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    background:#101923;
    border-top:1px solid #263342;
    z-index:10;
}

.nav button{
    border:0;
    background:none;
    color:#758294;
    cursor:pointer;
    font-size:10px;
    min-width:55px;
}

.nav-icon{
    font-size:19px;
    margin-bottom:4px;
}

.active{
    color:#19d39c !important;
}

.nav button:active{
    transform:scale(.92);
}

/* RESPONSIVE */

@media(min-width:401px){

    .app{
        width:100%;
        max-width:1200px;
    }

    .nav{
        width:100%;
        max-width:1200px;
    }

    .content{
        max-width:650px;
        margin:auto;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<header class="header">

    <div
        class="logo"
        onclick="go('interface.html')">

        FIN<span>TRADE</span>

    </div>


    <button
        class="profile"
        onclick="go('profile.html')">

        👤

    </button>

</header>


<main class="content">

    <div class="welcome">
        Informasi Nasabah
    </div>

    <div class="name">
        JAMALLIAH BINTI SERUJI
    </div>


    <!-- RDN -->

    <div
        class="rdn-card"
        onclick="go('balance.html')">

        <div class="rdn-label">
            SALDO RDN
        </div>

        <div class="rdn-balance">
            MYR 1.008.015,12
        </div>

        <div class="rdn-status">
            ● Rekening Aktif
        </div>

    </div>


    <!-- MARKET -->

    <div class="section-title">
        Market
    </div>

    <div class="menu">

        <button
            class="menu-item"
            onclick="go('infmarket.html')">

            <div class="icon">
                ◉
            </div>

            <div>

                <div class="menu-title">
                    Market
                </div>

                <div class="menu-subtitle">
                    Informasi pasar dan pergerakan harga
                </div>

            </div>

        </button>

    </div>


    <!-- INFORMASI NASABAH -->

    <div class="section-title">
        Informasi Nasabah
    </div>

    <div class="info">

        <div
            class="info-row"
            onclick="go('profile.html')">

            <div class="label">
                Nama Nasabah
            </div>

            <div class="value">
                JAMALLIAH BINTI SERUJI           </div>

        </div>


        <div
            class="info-row"
            onclick="go('profile.html')">

            <div class="label">
                ID Nasabah
            </div>

            <div class="value">
                user9004781
            </div>

        </div>


        <div class="info-row">

            <div class="label">
                Status Akun
            </div>

            <div class="value green">
                Aktif
            </div>

        </div>


        <div class="info-row">

            <div class="label">
                Status RDN
            </div>

            <div class="value green">
                Aktif
            </div>

        </div>

    </div>


    <!-- RIWAYAT -->

    <div class="section-title">
        Aktivitas
    </div>

    <div class="menu">

        <button
            class="menu-item"
            onclick="go('infstory.html')">

            <div class="icon">
                ▣
            </div>

            <div>

                <div class="menu-title">
                    Riwayat Dana
                </div>

                <div class="menu-subtitle">
                    Dana masuk dan dana keluar
                </div>

            </div>

        </button>

    </div>

</main>


<!-- NAVIGASI -->

<nav class="nav">

    <button
        class="active"
        onclick="go('interface.html')">

        <div class="nav-icon">
            ⌂
        </div>

        Beranda

    </button>


    <button
        onclick="go('infmarket.html')">

        <div class="nav-icon">
            ◉
        </div>

        Market

    </button>


    <button
        onclick="go('infstory.html')">

        <div class="nav-icon">
            ▣
        </div>

        Riwayat

    </button>


    <button
        onclick="go('profile.html')">

        <div class="nav-icon">
            👤
        </div>

        Profil

    </button>

</nav>

</div>


<script>

function go(page){

    window.location.href = page;

}

</script>

</body>
</html>
