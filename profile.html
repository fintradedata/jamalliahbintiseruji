<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Module</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080d14;
    color:#fff;
    font-family:Arial,sans-serif;
}

.profile-page{
    width:min(100%,400px);
    min-height:100vh;
    margin:auto;
    background:#0e1621;
}

/* HEADER */

.profile-header{
    height:64px;
    padding:0 16px;
    display:flex;
    align-items:center;
    gap:14px;
    border-bottom:1px solid #243140;
}

.back{
    width:36px;
    height:36px;
    border:0;
    border-radius:9px;
    background:#192533;
    color:#fff;
    font-size:21px;
    cursor:pointer;
}

.title{
    font-size:18px;
    font-weight:700;
}

/* CONTENT */

.profile-content{
    padding:20px 16px 35px;
}

.profile-main{
    text-align:center;
    padding:10px 0 25px;
}

.avatar{
    width:82px;
    height:82px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(145deg,#19d39c,#087b60);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:27px;
    font-weight:800;
}

.name{
    margin-top:13px;
    font-size:20px;
    font-weight:700;
}

.username{
    margin-top:5px;
    color:#7d8999;
    font-size:12px;
}

.verified{
    display:inline-block;
    margin-top:10px;
    padding:5px 11px;
    border-radius:20px;
    background:#12382f;
    color:#19d39c;
    font-size:10px;
    font-weight:700;
}

/* CARD */

.card{
    margin-bottom:14px;
    border:1px solid #263545;
    border-radius:14px;
    background:#131e2a;
    overflow:hidden;
}

.card-title{
    padding:15px;
    color:#8996a7;
    font-size:11px;
    font-weight:700;
}

.item{
    width:100%;
    min-height:58px;
    padding:10px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border:0;
    border-top:1px solid #222e3c;
    background:transparent;
    color:#fff;
    text-align:left;
    cursor:pointer;
}

.item:hover{
    background:#182431;
}

.item:active{
    transform:scale(.99);
}

.item-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.icon{
    width:36px;
    height:36px;
    border-radius:9px;
    background:#1b2938;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:17px;
}

.item-name{
    font-size:13px;
    font-weight:600;
}

.item-info{
    margin-top:4px;
    color:#718093;
    font-size:10px;
}

.arrow{
    color:#687688;
    font-size:19px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.72);
    align-items:flex-end;
    justify-content:center;
}

.modal-box{
    width:min(100%,400px);
    max-height:85vh;
    overflow-y:auto;
    padding:22px;
    background:#121c28;
    border-radius:20px 20px 0 0;
    border:1px solid #293747;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.modal-title{
    font-size:18px;
    font-weight:700;
}

.close{
    width:34px;
    height:34px;
    border:0;
    border-radius:8px;
    background:#202c3a;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

.modal-text{
    color:#8996a7;
    font-size:13px;
    line-height:1.6;
}

.info-box{
    margin-top:12px;
    padding:14px;
    border-radius:10px;
    background:#0c141e;
    border:1px solid #253344;
}

.info-label{
    color:#738194;
    font-size:10px;
}

.info-value{
    margin-top:5px;
    font-size:14px;
    font-weight:600;
}

/* WITHDRAW */

.withdraw-box{
    margin-top:12px;
    padding:14px;
    border-radius:11px;
    background:#0c141e;
    border:1px solid #263646;
}

.withdraw-label{
    color:#788698;
    font-size:10px;
}

.withdraw-input{
    width:100%;
    height:48px;
    margin-top:8px;
    padding:0 13px;
    border:1px solid #2a3b4c;
    border-radius:9px;
    background:#111c27;
    color:#fff;
    font-size:16px;
    outline:none;
}

.withdraw-input:focus{
    border-color:#19d39c;
}

.withdraw-button{
    width:100%;
    height:46px;
    margin-top:12px;
    border:0;
    border-radius:9px;
    background:#19d39c;
    color:#06130f;
    font-weight:700;
    cursor:pointer;
}

.withdraw-button:active{
    transform:scale(.98);
}

.error-icon{
    width:58px;
    height:58px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#351b21;
    color:#ff6575;
    font-size:28px;
    font-weight:bold;
}

.error-title{
    margin-top:14px;
    text-align:center;
    font-size:16px;
    font-weight:700;
}

.error-description{
    margin-top:8px;
    text-align:center;
    color:#8996a7;
    font-size:12px;
    line-height:1.6;
}

/* LOGOUT */

.logout{
    width:100%;
    height:48px;
    margin-top:6px;
    border:1px solid #542a32;
    border-radius:10px;
    background:#21151a;
    color:#ff6575;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

/* RESPONSIVE */

@media(min-width:401px){

    .profile-page{
        width:100%;
        max-width:1200px;
    }

    .profile-content{
        width:500px;
        max-width:100%;
        margin:auto;
    }

    .modal-box{
        margin-bottom:0;
    }
}

@media(max-width:350px){

    .profile-content{
        padding:16px 12px 30px;
    }

    .avatar{
        width:72px;
        height:72px;
    }
}
</style>
</head>

<body>

<div class="profile-page">

<header class="profile-header">

    <button class="back" onclick="goBack()">
        ←
    </button>

    <div class="title">
        Profil Saya
    </div>

</header>


<main class="profile-content">

<!-- PROFILE -->

<section class="profile-main">

    <div class="avatar">
        JS
    </div>

    <div class="name">
        JAMALLIAH BINTI SERUJI
    </div>

    <div class="username">
        @user9004781
    </div>

    <div class="verified">
        ✓ AKUN TERVERIFIKASI
    </div>

</section>


<!-- INFORMASI AKUN -->

<section class="card">

<div class="card-title">
    INFORMASI AKUN
</div>


<button class="item" onclick="openMenu('personal')">

    <div class="item-left">

        <div class="icon">
            👤
        </div>

        <div>

            <div class="item-name">
                Informasi Pribadi
            </div>

            <div class="item-info">
                Kelola informasi akun
            </div>

        </div>

    </div>

    <div class="arrow">›</div>

</button>


<button class="item" onclick="openMenu('security')">

    <div class="item-left">

        <div class="icon">
            🔒
        </div>

        <div>

            <div class="item-name">
                Keamanan
            </div>

            <div class="item-info">
                Password & autentikasi
            </div>

        </div>

    </div>

    <div class="arrow">›</div>

</button>


<button class="item" onclick="openMenu('verification')">

    <div class="item-left">

        <div class="icon">
            🛡️
        </div>

        <div>

            <div class="item-name">
                Verifikasi Identitas
            </div>

            <div class="item-info">
                Status verifikasi akun
            </div>

        </div>

    </div>

    <div class="arrow">›</div>

</button>

</section>


<!-- KEUANGAN -->

<section class="card">

<div class="card-title">
    KEUANGAN
</div>


<button class="item" onclick="openMenu('balance')">

    <div class="item-left">

        <div class="icon">
            💰
        </div>

        <div>

            <div class="item-name">
                Saldo RDN
            </div>

            <div class="item-info">
                MYR 1.008.015
            </div>

        </div>

    </div>

    <div class="arrow">›</div>

</button>


<!-- TARIK DANA -->

<button class="item" onclick="openWithdraw()">

    <div class="item-left">

        <div class="icon">
            ↓
        </div>

        <div>

            <div class="item-name">
                Tarik Dana
            </div>

            <div class="item-info">
                Tarik saldo dari RDN
            </div>

        </div>

    </div>

    <div class="arrow">›</div>

</button>


<button class="item" onclick="openMenu('history')">

    <div class="item-left">

        <div class="icon">
            📋
        </div>

        <div>

            <div class="item-name">
                Riwayat Transaksi
            </div>

            <div class="item-info">
                Lihat aktivitas akun
            </div>

        </div>

    </div>

    <div class="arrow">›</div>

</button>

</section>


<!-- PENGATURAN -->

<section class="card">

<div class="card-title">
    PENGATURAN
</div>


<button class="item" onclick="openMenu('notification')">

    <div class="item-left">

        <div class="icon">
            🔔
        </div>

        <div>

            <div class="item-name">
                Notifikasi
            </div>

            <div class="item-info">
                Atur pemberitahuan
            </div>

        </div>

    </div>

    <div class="arrow">›</div>

</button>


<button class="item" onclick="openMenu('language')">

    <div class="item-left">

        <div class="icon">
            🌐
        </div>

        <div>

            <div class="item-name">
                Bahasa
            </div>

            <div class="item-info">
                Bahasa Indonesia
            </div>

        </div>

    </div>

    <div class="arrow">›</div>

</button>

</section>


<button class="logout" onclick="logout()">
    KELUAR DARI AKUN
</button>

</main>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-box">

    <div class="modal-head">

        <div class="modal-title" id="modalTitle">
            Menu
        </div>

        <button class="close" onclick="closeMenu()">
            ×
        </button>

    </div>

    <div id="modalContent">
        Informasi menu.
    </div>

</div>

</div>


<script>

/* DATA MENU */

const menuData = {

personal:{
    title:"Informasi Pribadi",
    content:`
        <div class="info-box">
            <div class="info-label">Jamalliah Binti Seruji</div>
            <div class="info-value">RDN</div>
        </div>

        <div class="info-box">
            <div class="info-label">user9004781</div>
            <div class="info-value">@user9004781</div>
        </div>

        <div class="info-box">
            <div class="info-label">Status</div>
            <div class="info-value">Akun Terverifikasi</div>
        </div>
    `
},

security:{
    title:"Keamanan",
    content:`
        <div class="info-box">
            <div class="info-label">Password</div>
            <div class="info-value">••••••••</div>
        </div>

        <div class="info-box">
            <div class="info-label">Autentikasi</div>
            <div class="info-value">Aktif</div>
        </div>
    `
},

verification:{
    title:"Verifikasi Identitas",
    content:`
        <div class="info-box">
            <div class="info-label">Status</div>
            <div class="info-value">✓ Terverifikasi</div>
        </div>
    `
},

balance:{
    title:"Saldo RDN",
    content:`
        <div class="info-box">
            <div class="info-label">Total Saldo</div>
            <div class="info-value">
                MYR 1.008.015
            </div>
        </div>

        <div class="info-box">
            <div class="info-label">Status RDN</div>
            <div class="info-value" style="color:#19d39c">
                Aktif
            </div>
        </div>
    `
},

history:{
    title:"Riwayat Transaksi",
    content:`
        <div class="info-box">
            <div class="info-label">Penyimpanan</div>
            <div class="info-value">
                +MYR 1.008.015
            </div>
        </div>
    `
},

notification:{
    title:"Notifikasi",
    content:`
        <div class="info-box">
            <div class="info-label">Status Notifikasi</div>
            <div class="info-value" style="color:#19d39c">
                Aktif
            </div>
        </div>
    `
},

language:{
    title:"Bahasa",
    content:`
        <div class="info-box">
            <div class="info-label">Bahasa Saat Ini</div>
            <div class="info-value">
                Bahasa Indonesia
            </div>
        </div>
    `
}

};


/* OPEN MENU */

function openMenu(type){

    const data = menuData[type];

    document.getElementById("modalTitle").textContent =
        data.title;

    document.getElementById("modalContent").innerHTML =
        data.content;

    document.getElementById("modal").style.display =
        "flex";
}


/* WITHDRAW */

function openWithdraw(){

    document.getElementById("modalTitle").textContent =
        "Tarik Dana";

    document.getElementById("modalContent").innerHTML = `

        <div class="info-box">

            <div class="info-label">
                SALDO RDN
            </div>

            <div class="info-value">
                MYR 1.008.015
            </div>

        </div>

        <div class="withdraw-box">

            <div class="withdraw-label">
                JUMLAH PENARIKAN
            </div>

            <input
                id="withdrawAmount"
                class="withdraw-input"
                type="number"
                min="1"
                placeholder="Masukkan jumlah"
            >

            <button
                class="withdraw-button"
                onclick="submitWithdraw()">

                Lanjutkan Penarikan

            </button>

        </div>
    `;

    document.getElementById("modal").style.display =
        "flex";
}


/* SUBMIT WITHDRAW */

function submitWithdraw(){

    const input =
        document.getElementById("withdrawAmount");

    const amount =
        Number(input.value);

    if(!amount || amount <= 0){

        alert("Masukkan jumlah penarikan yang valid.");

        return;
    }

    showWithdrawError(amount);
}


/* WITHDRAW ERROR */

function showWithdrawError(amount){

    document.getElementById("modalTitle").textContent =
        "Penarikan Gagal";

    document.getElementById("modalContent").innerHTML = `

        <div style="text-align:center;padding:10px 0 5px">

            <div class="error-icon">
                !
            </div>

            <div class="error-title">
                Penarikan Tidak Berhasil
            </div>

            <div class="error-description">

                Permintaan penarikan sebesar

                <strong style="color:#fff">
                    MYR${amount.toLocaleString("id-ID")}
                </strong>

                tidak dapat diproses.

            </div>

        </div>


        <div class="info-box">

            <div class="info-label">
                STATUS
            </div>

            <div
                class="info-value"
                style="color:#ff6575">

                Penarikan Gagal

            </div>

        </div>


        <div class="info-box">

            <div class="info-label">
                INFORMASI
            </div>

            <div class="info-value">

                Deposito minimum belum mencukupi<br>Silahkan lakukan penyetoran saldo sebesar MYR 15.750,00.

            </div>

        </div>


        <button
            class="withdraw-button"
            onclick="contactCustomerService()">

            Hubungi Customer Service

        </button>

    `;
}


/* CUSTOMER SERVICE */

function contactCustomerService(){

    alert(
        "Customer Service\n\n" +
        "Silakan hubungi Customer Service " +
        "untuk mendapatkan bantuan terkait " +
        "penarikan dana."
    );

}


/* CLOSE */

function closeMenu(){

    document.getElementById("modal").style.display =
        "none";
}


/* BACK */

function goBack(){

    window.history.back();

}


/* LOGOUT */

function logout(){

    const confirmLogout =
        confirm(
            "Apakah Anda yakin ingin keluar dari akun?"
        );

    if(confirmLogout){

        alert("Anda telah keluar dari akun.");

    }

}

</script>

</body>
</html>
