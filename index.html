<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinTrade</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#080d14;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.loader{
    text-align:center;
    color:#fff;
}

.logo{
    font-size:30px;
    font-weight:800;
}

.logo span{
    color:#19d39c;
}

.loading{
    margin-top:15px;
    color:#718093;
    font-size:12px;
}

.spinner{
    width:30px;
    height:30px;
    margin:18px auto 0;
    border:3px solid #263545;
    border-top-color:#19d39c;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

</style>
</head>
